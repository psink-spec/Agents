<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>Hero loop — golden dust</title>
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: #000;
      }
      #root { position: relative; width: 3840px; height: 2160px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      /* full-bleed fill lives on a child, never the root (frame compositing rule) */
      #ground {
        position: absolute; inset: 0;
        background: linear-gradient(115deg, #0b0f15 0%, #0d1622 55%, #0e2233 100%);
      }
      .orb { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform, opacity; }
      #orb-gold {
        width: 2600px; height: 2600px; right: -700px; top: -900px;
        background: radial-gradient(circle, rgba(212,169,79,0.32) 0%, rgba(212,169,79,0.10) 45%, rgba(212,169,79,0) 70%);
      }
      #orb-steel {
        width: 2200px; height: 2200px; left: -800px; bottom: -1000px;
        background: radial-gradient(circle, rgba(36,84,120,0.38) 0%, rgba(36,84,120,0.12) 45%, rgba(36,84,120,0) 70%);
      }
      #orb-ember {
        width: 1400px; height: 1400px; left: 30%; top: 55%;
        background: radial-gradient(circle, rgba(201,154,63,0.16) 0%, rgba(201,154,63,0) 65%);
      }
      .dust {
        position: absolute;
        border-radius: 50%;
        background: #e5c37a;
        opacity: 0;
        will-change: transform, opacity;
      }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 120% 100% at 50% 45%, transparent 55%, rgba(5,9,14,0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="3840"
      data-height="2160"
    >
      <div id="scene" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <div id="ground"></div>
        <div id="orb-gold" class="orb"></div>
        <div id="orb-steel" class="orb"></div>
        <div id="orb-ember" class="orb"></div>
        <div id="dust-field"></div>
        <div id="vignette"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DUR = 10;

      /* seeded PRNG — determinism contract forbids unseeded Math.random */
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rnd = mulberry32(20260721);

      /* aurora breathing — yoyo legs sized so t=0 and t=10 match exactly */
      tl.to("#orb-gold",  { x: -260, y: 180, scale: 1.12, duration: 2.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.to("#orb-steel", { x: 300, y: -220, scale: 1.09, duration: 5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
      tl.to("#orb-ember", { opacity: 0.5, scale: 1.25, duration: 2.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);

      /* golden dust — each mote loops on a cycle that divides 10s; opacity is 0
         at every cycle boundary so the restart jump is invisible */
      var field = document.getElementById("dust-field");
      var cycles = [2.5, 5, 10];
      for (var i = 0; i < 170; i++) {
        var p = document.createElement("div");
        p.className = "dust";
        p.id = "dust-" + i;
        var size = 3 + rnd() * 9;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = (rnd() * 3840) + "px";
        p.style.top = (rnd() * 2160) + "px";
        field.appendChild(p);

        var d = cycles[Math.floor(rnd() * cycles.length)];
        var drift = 120 + rnd() * 260;
        var sway = (rnd() - 0.5) * 220;
        var peak = 0.25 + rnd() * 0.6;

        tl.to(p, { x: sway, y: -drift, duration: d, repeat: DUR / d - 1, ease: "none" }, 0);
        tl.to(p, { opacity: peak, duration: d / 2, yoyo: true, repeat: (DUR / (d / 2)) - 1, ease: "sine.inOut" }, 0);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
