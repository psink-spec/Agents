<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>Film loop — flowing silk</title>
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: #000;
      }
      #root { position: relative; width: 3840px; height: 2160px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      /* full-bleed fill lives on a child, never the root (frame compositing rule) */
      #ground {
        position: absolute; inset: 0;
        background: linear-gradient(160deg, #0a1420 0%, #0e2233 60%, #10293e 100%);
      }
      .silk {
        position: absolute;
        left: -20%;
        width: 140%;
        height: 26%;
        filter: blur(70px);
        will-change: transform, opacity;
      }
      .silk--steel {
        background: linear-gradient(90deg, transparent 0%, rgba(120,160,200,0.20) 30%, rgba(90,130,175,0.30) 55%, transparent 100%);
      }
      .silk--gold {
        background: linear-gradient(90deg, transparent 0%, rgba(229,195,122,0.30) 35%, rgba(212,169,79,0.42) 60%, transparent 100%);
      }
      .silk--deep {
        background: linear-gradient(90deg, transparent 0%, rgba(20,50,80,0.45) 40%, rgba(14,34,51,0.5) 65%, transparent 100%);
      }
      #glow {
        position: absolute;
        width: 1800px; height: 1800px; right: -400px; top: -700px;
        border-radius: 50%;
        filter: blur(110px);
        background: radial-gradient(circle, rgba(212,169,79,0.36) 0%, rgba(212,169,79,0) 68%);
        will-change: transform, opacity;
      }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 125% 105% at 50% 50%, transparent 52%, rgba(4,8,13,0.6) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="3840"
      data-height="2160"
    >
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="ground"></div>
        <div id="silk-field"></div>
        <div id="glow"></div>
        <div id="vignette"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* seeded PRNG — determinism contract forbids unseeded Math.random */
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rnd = mulberry32(19620405);

      /* 14 silk ribbons; every yoyo tween runs an even number of legs inside
         the 12s duration, so the last frame equals the first — seamless loop */
      var kinds = ["silk--steel", "silk--gold", "silk--deep", "silk--steel", "silk--deep"];
      var field = document.getElementById("silk-field");
      var durations = [3, 6, 1.5];
      for (var i = 0; i < 14; i++) {
        var s = document.createElement("div");
        s.className = "silk " + kinds[i % kinds.length];
        s.id = "silk-" + i;
        s.style.top = (-6 + i * 7.4 + (rnd() - 0.5) * 4) + "%";
        s.style.transform = "rotate(" + (-9 + rnd() * 6) + "deg)";
        field.appendChild(s);

        var d = durations[Math.floor(rnd() * durations.length)];
        var legs = 12 / d; /* 4, 2, or 8 legs — always even */
        tl.to(s, {
          x: (rnd() - 0.5) * 700,
          y: (rnd() - 0.5) * 160,
          scaleY: 0.85 + rnd() * 0.5,
          duration: d,
          yoyo: true,
          repeat: legs - 1,
          ease: "sine.inOut"
        }, 0);
      }

      tl.to("#glow", { x: -420, y: 260, opacity: 0.7, duration: 6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
